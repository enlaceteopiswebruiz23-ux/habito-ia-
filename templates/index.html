<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coach de hábitos con IA</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;color:#222}
    button{padding:.7rem 1.2rem;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:1rem;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .box{margin-top:1rem;padding:1rem;border-radius:8px;background:#f3f4f6;white-space:pre-wrap}
    .error{background:#fee2e2;color:#991b1b}
    table{width:100%;margin-top:1rem;border-collapse:collapse}
    td,th{padding:.4rem;border-bottom:1px solid #ddd;text-align:left}
  </style>
</head>
<body>
  <h1>Coach de hábitos 🤖</h1>
  <p>Resumen de tu semana según tus rachas y tus notas.</p>
  <input id="uid" placeholder="Tu user_id" style="padding:.6rem;width:70%">
  <button id="btn">Analizar mi semana</button>
  <div id="out"></div>

<script>
const btn = document.getElementById("btn");
const out = document.getElementById("out");

function cell(text){ const td=document.createElement("td"); td.textContent=text; return td; }

btn.addEventListener("click", async () => {
  const user_id = document.getElementById("uid").value.trim();
  btn.disabled = true;
  out.innerHTML = '<div class="box">Tu coach está pensando… ⏳</div>';   // estado de carga
  try {
    const r = await fetch("/api/ai/weekly-summary", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Error inesperado");
    out.innerHTML = '<div class="box"></div><table><tr><th>Hábito</th><th>Racha</th><th>Semana</th></tr></table>';
    out.querySelector(".box").textContent = data.message;   // textContent: evita inyectar HTML
    const table = out.querySelector("table");
    data.stats.forEach(s => {
      const tr = document.createElement("tr");
      tr.append(cell(s.habito), cell(s.racha_actual + " días"), cell(s.porcentaje_semana + "%"));
      table.appendChild(tr);
    });
  } catch (e) {
    out.innerHTML = '<div class="box error"></div>';
    out.querySelector(".box").textContent = e.message;       // estado de error
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
